---
- name: set up
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - vars/main.yaml

  # roles/dotfiles already syncs dotfiles_repo_local_destination without
  # discarding local edits (see its tasks). geerlingguy.dotfiles runs its
  # own independent ansible.builtin.git clone/update against the same
  # destination and would otherwise fail whenever it has local
  # modifications, so its update is disabled here.
  module_defaults:
    ansible.builtin.git:
      update: false

  roles:
    - dotfiles
    - geerlingguy.dotfiles
    - scripts
    - homebrew
    - homebrew_cask
    - mac_app_store
    - nodejs
    - launchd
