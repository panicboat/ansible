---
dotfiles_repo: "git@github.com:panicboat/dotfiles.git"
dotfiles_repo_version: main
dotfiles_repo_local_destination: "~/GitHub/panicboat/dotfiles"
dotfiles_exclude:
  - README.md
  - LICENSE
  - .aws/config
  - .gitignore
  - .pre-commit-config.yaml
dotfiles_executable_dirs:
  - .claude/scripts

launchd_jobs:
  # Weekly Homebrew maintenance: keep formulae/casks up to date and prune old versions
  - label: com.panicboat.homebrew-upgrade
    command: brew update && brew upgrade && brew upgrade --cask && brew cleanup && brew autoremove
    weekday: 1
    hour: 7
    minute: 0
