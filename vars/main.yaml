---
dotfiles_repo: "git@github.com:panicboat/dotfiles.git"
dotfiles_repo_version: main
dotfiles_repo_local_destination: "~/GitHub/panicboat/dotfiles"
dotfiles_exclude:
  - README.md
  - LICENSE
  - .aws/config
  - .worktrees
  - .gitignore
  - .pre-commit-config.yaml
dotfiles_executable_dirs:
  - .claude/scripts

launchd_jobs:
  # Weekly Homebrew maintenance: keep formulae/casks up to date and prune old versions
  - label: com.panicboat.homebrew-upgrade
    command: brew update && brew upgrade && brew upgrade --cask && brew cleanup && brew autoremove
    weekday: 1
    hour: 7
    minute: 0

  # Weekly documentation linter refresh: follow upstream Vale styles and textlint rules
  - label: com.panicboat.doc-lint-upgrade
    command: VALE_STYLES_PATH="$HOME/.local/share/doc-lint/vale-styles" /opt/homebrew/bin/vale --config "$HOME/.config/vale/.vale.ini" sync && "$HOME/.nodenv/shims/npm" install --prefix "$HOME/.local/share/doc-lint" --ignore-scripts --no-audit --no-fund textlint@latest textlint-rule-preset-ja-technical-writing@latest
    weekday: 1
    hour: 7
    minute: 30
