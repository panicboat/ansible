- name: define homebrew cask taps
  ansible.builtin.set_fact:
    homebrew_cask_taps:
      - name: aurorascharff/clicklight
        url: https://github.com/aurorascharff/ClickLight
      - name: manaflow-ai/cmux
      - name: fujibee/agmsg

- name: add homebrew cask taps
  community.general.homebrew_tap:
    name: "{{ item.name }}"
    url: "{{ item.url | default(omit) }}"
  loop: "{{ homebrew_cask_taps }}"

- name: trust homebrew cask taps
  ansible.builtin.command:
    cmd: "brew trust --tap {{ item.name }}"
  loop: "{{ homebrew_cask_taps }}"
  # register: brew_trust_check
  # changed_when: "'Trusted' in brew_trust_check.stdout or brew_trust_check.rc == 0"

- name: define homebrew cask packages
  ansible.builtin.set_fact:
    homebrew_cask_list:
      - 1password
      - agmsg
      - antigravity-cli
      - aurorascharff/clicklight/clicklight
      # - brave-browser
      - chatgpt
      - claude
      - claude-code
      - clipy
      - cmux
      - codex
      - github
      # - google-chrome
      - google-cloud-sdk
      - keyclu
      - raycast
      - slack
      - steipete/tap/codexbar
      - visual-studio-code

- name: detect and repair missing cask artifacts
  ansible.builtin.shell:
    cmd: |
      set -e
      cask="{{ item }}"
      short="${cask##*/}"
      caskroom="/opt/homebrew/Caskroom/$short"
      [ -d "$caskroom" ] || exit 0
      if find "$caskroom" -type l ! -exec test -e {} \; -print | grep -q .; then
        brew reinstall --cask "$cask"
        echo REPAIRED
      fi
  loop: "{{ homebrew_cask_list }}"
  register: homebrew_cask_repair
  changed_when: "'REPAIRED' in homebrew_cask_repair.stdout"

  # https://formulae.brew.sh/cask/
- name: install homebrew cask packages
  community.general.homebrew_cask:
    name: "{{ homebrew_cask_list }}"

- name: uninstall homebrew cask packages
  community.general.homebrew_cask:
    name:
      - cheatsheet
      - ghostty
      - iterm2
    state: absent
  ignore_errors: true
