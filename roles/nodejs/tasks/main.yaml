- name: Install Node.js via nodenv
  ansible.builtin.command: nodenv install --skip-existing 26.1.0
  register: nodenv_install
  changed_when: "'Installed' in nodenv_install.stdout"

- name: Read current global Node.js version
  ansible.builtin.command: nodenv global
  register: nodenv_global
  changed_when: false

- name: Set global Node.js version
  ansible.builtin.command: nodenv global 26.1.0
  when: nodenv_global.stdout != "26.1.0"

- name: Install npm global packages
  community.general.npm:
    name: "@evenrealities/even-terminal"
    global: true
    executable: "{{ lookup('env', 'HOME') }}/.nodenv/shims/npm"

- name: Install agmsg cross-agent messaging
  ansible.builtin.command: "{{ lookup('env', 'HOME') }}/.nodenv/shims/npx --yes agmsg install --cmd agmsg"
  args:
    creates: "{{ lookup('env', 'HOME') }}/.agents/skills/agmsg/.agmsg"

- name: Install documentation linters
  ansible.builtin.command: >-
    {{ lookup('env', 'HOME') }}/.nodenv/shims/npm install --prefix {{ lookup('env', 'HOME') }}/.local/share/doc-lint
    --ignore-scripts --no-audit --no-fund textlint@latest textlint-rule-preset-ja-technical-writing@latest
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/share/doc-lint/node_modules/.bin/textlint"

- name: Create the Vale styles directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/doc-lint/vale-styles"
    state: directory

- name: Install Vale style packages
  ansible.builtin.command: /opt/homebrew/bin/vale --config {{ lookup('env', 'HOME') }}/.config/vale/.vale.ini sync
  environment:
    VALE_STYLES_PATH: "{{ lookup('env', 'HOME') }}/.local/share/doc-lint/vale-styles"
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/share/doc-lint/vale-styles/Google"
